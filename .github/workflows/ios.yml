name: iOS unsigned IPA

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build unsigned IPA
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project AdisyonYonetim.xcodeproj \
            -scheme AdisyonYonetim \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_ENTITLEMENTS= \
            DEVELOPMENT_TEAM= \
            PROVISIONING_PROFILE_SPECIFIER= \
            PRODUCT_NAME=AdisyonYonetim \
            build | tee xcodebuild.log

      - name: Package IPA
        run: |
          set -euo pipefail
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -1)
          test -n "$APP"
          rm -rf Payload
          mkdir -p Payload
          cp -R "$APP" Payload/AdisyonYonetim.app
          test -f Payload/AdisyonYonetim.app/AdisyonYonetim
          EXEC=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' Payload/AdisyonYonetim.app/Info.plist)
          DISPLAY=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' Payload/AdisyonYonetim.app/Info.plist)
          echo "CFBundleExecutable=${EXEC}"
          echo "CFBundleDisplayName=${DISPLAY}"
          test "$EXEC" = "AdisyonYonetim"
          test "$DISPLAY" = "Adisyon Yönetim"
          test -f Payload/AdisyonYonetim.app/PrivacyInfo.xcprivacy
          if /usr/libexec/PlistBuddy -c 'Print :UIBackgroundModes' Payload/AdisyonYonetim.app/Info.plist >/dev/null 2>&1; then
            echo "UIBackgroundModes must be absent while PUSH_ENABLED=NO" >&2
            exit 1
          fi
          python3 - <<'PY'
          import os
          import zipfile

          ipa = "adisyon-yonetim.ipa"
          required = "Payload/AdisyonYonetim.app/AdisyonYonetim"
          with zipfile.ZipFile(ipa, "w", compression=zipfile.ZIP_DEFLATED) as zf:
              for root, dirs, files in os.walk("Payload"):
                  dirs.sort()
                  files.sort()
                  for name in files:
                      path = os.path.join(root, name)
                      arc = path.replace(os.sep, "/")
                      if not arc.isascii():
                          raise SystemExit(f"non-ASCII zip entry: {arc!r}")
                      zf.write(path, arc)
          with zipfile.ZipFile(ipa) as zf:
              names = zf.namelist()
              print("IPA listing:")
              for name in names:
                  print(name)
                  if not name.isascii():
                      raise SystemExit(f"non-ASCII zip entry: {name!r}")
              if required not in names:
                  raise SystemExit(f"missing {required}")
          print(f"verified {required}")
          PY

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: adisyon-yonetim-ipa
          path: adisyon-yonetim.ipa
          if-no-files-found: error

      - name: Upload build log
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: xcodebuild.log
          if-no-files-found: ignore
